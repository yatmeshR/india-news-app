# Free scheduled ingestion (replaces a paid always-on worker).
# Needs repo secret MONGO_URI (Atlas connection string). Scheduled runs are free for public repos.
name: ingest-news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.ingest.run
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: newsapp
          RETENTION_DAYS: "14"
